<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG for the home-screen icon and falls back to a screenshot
         of the page without this. PNG, opaque: iOS applies its own mask and
         renders transparency as black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10a37a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS launch screens (v3 P5).

         manifest.json's background_color stays #ffffff and always will — it
         takes ONE colour, has no media-query form, and the OS caches the
         manifest at install time. CLAUDE.md §18 rule 6 is right about that.

         apple-touch-startup-image is a different mechanism and DOES accept a
         media attribute, prefers-color-scheme included. A non-matching device
         simply gets no splash and falls back to background_color, so adding
         sizes is additive and never breaks an unlisted phone. -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/splash-iphone-se-light.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/splash-iphone-se-dark.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/splash-iphone-x-light.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/splash-iphone-x-dark.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/splash-iphone-13-light.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/splash-iphone-13-dark.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/splash-iphone-15-light.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/splash-iphone-15-dark.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/splash-iphone-16-pro-light.png" />

    <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/splash-iphone-16-pro-max-dark.png" />
    <title>Daybook</title>
    <script>
      // Pre-paint theme. The real preference lives on the server and is not
      // readable until after the session check and /settings, so a dark-themed
      // app would flash full white on every load. src/lib/theme.ts mirrors the
      // preference here; this replays it before the first paint.
      // Keep the storage key, the class, the data-theme attribute and the
      // theme-color hex in step with src/lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem('daybook.theme') || 'light'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          // Both markers (D-2): `dark` class for Tailwind utilities,
          // `data-theme` for the ported proposal CSS's [data-theme] selectors.
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (dark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#0d1117')
          }
        } catch (e) {
          // Storage unavailable — fall through to the light default.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
