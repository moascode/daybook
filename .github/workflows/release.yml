name: Release

# Cuts a release and deploys it when a semver tag is pushed (e.g. v1.2.0).
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Gates on the full test suite, applies pending D1 migrations, deploys the
# Worker, smoke-tests the live deployment, and publishes a GitHub Release.
#
# ── Ordering is the whole point ──────────────────────────────────────────────
# Migrations run BEFORE the deploy, and a failure there stops the job. Deployed
# code that queries a column the database does not have yet is a total outage,
# not a degraded feature — this exact hazard sat live for a day while W2/W3 were
# on main and migration 0010 was unapplied.
#
# ── What this no longer does ─────────────────────────────────────────────────
# It used to package the Express server + built frontend into a tarball for the
# Mac deploy tool (`infra/daybook deploy`). The Mac is retired as a deployment
# target (owner decision, 2026-07-29), and the server/ tree has not received
# feature work since the Workers cutover, so shipping it produced a release that
# silently lagged several waves behind. server/ stays in the repo because
# scripts/schema-diff.mjs gates CI on D1 matching server/migrations — it is a
# schema reference now, not a deployable.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # required to create the GitHub Release
  actions: read # required to read this commit's CI result

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, Migrate, Deploy
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Gate: this exact commit must already be green on CI ──────────────
      #
      # Promotion, not re-testing. CI has already run typecheck, lint and the
      # full sharded e2e suite against this SHA; running them again here costs
      # ~4 minutes, duplicates the flake surface (a release could fail for a
      # reason that has nothing to do with the release), and proves nothing new.
      #
      # What re-running *did* buy was a guarantee that the deployed tree is a
      # tested tree — a tag can point at any commit, including one CI never saw.
      # Asserting the SHA's CI result keeps that guarantee without the cost.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'
          echo "Looking for a CI run against $SHA"
          # A tag is usually pushed moments after a merge, so CI for that commit
          # may still be running. Wait rather than failing the release on a race.
          deadline=$(( $(date +%s) + 1500 ))
          while :; do
            run=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
                    --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last')
            if [ -n "$run" ] && [ "$run" != "null" ]; then
              status=$(echo "$run" | jq -r '.status')
              conclusion=$(echo "$run" | jq -r '.conclusion // "none"')
              url=$(echo "$run" | jq -r '.html_url')
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "✓ CI is green for $SHA — $url"
                  exit 0
                fi
                echo "✗ CI for $SHA concluded '$conclusion' — $url" >&2
                echo "Fix CI and re-tag, or re-run that CI run if it failed spuriously." >&2
                exit 1
              fi
              echo "  CI is $status — waiting…"
            else
              echo "  no CI run found for this commit yet — waiting…"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "✗ No completed CI run for $SHA within 25 minutes." >&2
              echo "Tags must point at a commit CI has built. Push the commit to main first." >&2
              exit 1
            fi
            sleep 20
          done

      # The client bundle still has to exist locally for `wrangler deploy` to
      # upload it — wrangler bundles the Worker from source at deploy time, so
      # there is no prebuilt Worker artifact to promote, only this.
      - name: Build client bundle
        run: npm run build

      # ── Everything below touches production ──────────────────────────────
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply daybook --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env=""

      # Prove the thing that just went live actually serves traffic. A deploy
      # that returns 500 on every request still "succeeds" as a deploy.
      - name: Smoke-test the deployment
        id: smoke
        run: |
          set -euo pipefail
          BASE=https://daybook.moascode.workers.dev
          echo "› health"
          health=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$BASE/api/health")
          echo "$health"
          echo "$health" | grep -q '"db":true'
          echo "› SPA root"
          curl -fsS -o /dev/null -w '%{http_code}\n' "$BASE/" | grep -q '^200$'
          # An unmatched /api path must return a JSON error, never the SPA's
          # index.html — that is the invariant worth protecting. The exact code
          # is 401 rather than 404 because requireAuth guards the whole /api
          # surface and rejects an unauthenticated caller before routing can
          # decide the path does not exist. Asserting 404 here would have failed
          # this pipeline on its first real run.
          echo "› unmatched /api/* is a JSON error, not the SPA"
          code=$(curl -sS -o /tmp/body -w '%{http_code}' "$BASE/api/definitely-not-a-route")
          case "$code" in 401|403|404) ;; *) echo "unexpected status $code" >&2; exit 1 ;; esac
          grep -q '"error"' /tmp/body
          ! grep -qi '<!doctype html' /tmp/body
          echo "✓ smoke passed"

      # Wrangler keeps the previous version server-side; roll straight back to it
      # rather than leaving a broken deployment up while someone reads the logs.
      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "✗ smoke test failed — rolling back" >&2
          npx wrangler rollback --message "automated rollback: smoke test failed for ${{ github.ref_name }}" --env="" || \
            echo "rollback failed; the previous version must be restored manually" >&2

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Daybook ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Deployed to https://daybook.moascode.workers.dev

            D1 migrations were applied before the Worker was deployed, and the
            deployment was smoke-tested (health, SPA root, JSON 404).
