name: CI

# Continuous integration: runs on every PR and on pushes to the main branch.
# Gates merges on typecheck + lint + build + the full Playwright e2e suite.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Lint & Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (client)
        run: npx tsc -b

      - name: Typecheck (server)
        run: npm run typecheck:server

      - name: Typecheck (worker)
        run: npm run typecheck:worker

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      # Validates wrangler.toml, the D1/assets bindings and that the Worker
      # bundles — without touching the Cloudflare account. Needs dist/, so it
      # must run after the build step. No credentials required.
      # `--env=""` targets the top-level (production) environment explicitly.
      # Without it wrangler warns, since wrangler.toml also defines [env.dev].
      - name: Validate Worker build (dry run)
        run: npx wrangler deploy --dry-run --env=""

      # Both backends exist until the Phase 7 cutover, so their migrations must
      # stay in step. This applies worker/migrations to a throwaway local
      # (Miniflare) D1 and diffs the result against what server/db.ts's runner
      # produces, failing on any drift. Local D1 needs no credentials.
      - name: D1 schema parity (server vs worker migrations)
        run: |
          npm run d1:migrate
          npm run d1:schema-diff

  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests (shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30
