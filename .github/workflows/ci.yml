name: CI

# Continuous integration: runs on every PR and on pushes to the main branch.
# Gates merges on typecheck + lint + build + the full Playwright e2e suite.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Lint & Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (client)
        run: npx tsc -b

      - name: Typecheck (server)
        run: npm run typecheck:server

      - name: Typecheck (worker)
        run: npm run typecheck:worker

      - name: Lint
        run: npm run lint

      # src/index.css is generated. Regenerate and fail if it differs from what
      # is committed — the only sanctioned writer is scripts/gen-theme-tokens.mjs
      # (CLAUDE.md §18). A hand-edit to the generated file is caught here.
      - name: Theme tokens are generated (no hand-edits)
        run: |
          npm run gen:tokens
          git diff --exit-code src/index.css

      # WCAG-AA gate on the generated theme. Fails below 4.5:1 (3.0:1 for the
      # decoration-only faint/dim roles). This is what stops the AA regressions
      # REVIEW found from creeping back the next time a neutral is tuned by eye.
      - name: Contrast (WCAG AA)
        run: npm run check:contrast

      - name: Build frontend
        run: npm run build

      # Validates wrangler.toml, the D1/assets bindings and that the Worker
      # bundles — without touching the Cloudflare account. Needs dist/, so it
      # must run after the build step. No credentials required.
      # `--env=""` targets the top-level (production) environment explicitly.
      # Without it wrangler warns, since wrangler.toml also defines [env.dev].
      - name: Validate Worker build (dry run)
        run: npx wrangler deploy --dry-run --env=""

      # Both backends exist until the Phase 7 cutover, so their migrations must
      # stay in step. This applies worker/migrations to a throwaway local
      # (Miniflare) D1 and diffs the result against what server/db.ts's runner
      # produces, failing on any drift. Local D1 needs no credentials.
      - name: D1 schema parity (server vs worker migrations)
        run: |
          npm run d1:migrate
          npm run d1:schema-diff

  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The official Playwright image ships the browsers AND every system library
    # they need. That removes both `playwright install` steps, and with them the
    # apt/dpkg lock hang that was the single largest source of red CI on this
    # repo — the most recent main failure never ran a test at all, it sat on
    # `install-deps` until the timeout and was killed as an orphan process.
    # Pin the tag to the @playwright/test version in package.json; a mismatch
    # makes Playwright re-download browsers at run time, which puts the apt
    # problem straight back.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    strategy:
      fail-fast: false
      matrix:
        # 8 shards, not 6: the suite grew past ~740 tests, which put 6 shards
        # over 100 tests apiece — the same "wrangler dev dies partway through
        # a long shard" risk that took shards from 3 to 6 in the first place
        # (workerd peaks around 1.1 GB on a 7 GB runner; more, shorter shards
        # cap what accumulates in any one of them). Bump this again if the
        # suite grows past ~800 tests and shards start creeping past 100.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests (shard ${{ matrix.shard }}/8)
        run: npx playwright test --shard=${{ matrix.shard }}/8

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      # wrangler writes the real stack trace here and it dies with the runner.
      # An empty `✘ [ERROR]` on the console cost a full investigation to place;
      # this makes the next occurrence readable straight from the run page.
      - name: Upload wrangler logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-logs-shard-${{ matrix.shard }}
          # upload-artifact globs; it does not expand `~`. HOME is /root in the
          # container and /home/runner on a bare runner, so name both rather
          # than silently uploading nothing — which is what "No files were
          # found" meant on the last few failures.
          path: |
            /root/.config/.wrangler/logs/
            /home/runner/.config/.wrangler/logs/
          if-no-files-found: ignore
          retention-days: 30
