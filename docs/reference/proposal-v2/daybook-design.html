<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook — Wallet · Overview</title>
<style>
/* =====================================================================
   DAYBOOK — DESIGN SYSTEM v2
   -----------------------------------------------------------------
   Structure:
     1. Primitives   raw ramps, never used directly by components
     2. Semantics    the only layer components are allowed to touch
     3. Scale        type, space, radius, elevation, motion
     4. Components
     5. Responsive   mobile is a different layout, not a reflow
   ===================================================================== */

/* ============ 1. PRIMITIVES ========================================= */
:root {
  /* neutral — cool gray, one ramp, used for both themes via semantics */
  --n-0:   255 255 255;
  --n-25:  250 251 252;
  --n-50:  246 247 249;
  --n-100: 240 242 245;
  --n-150: 233 236 241;
  --n-200: 225 229 235;
  --n-300: 203 209 219;
  --n-400: 156 165 179;
  --n-500: 122 132 148;
  --n-600:  93 103 119;
  --n-700:  67  76  90;
  --n-800:  42  49  60;
  --n-850:  30  35  44;
  --n-900:  22  26  33;
  --n-950:  14  17  22;
  --n-1000: 9  11  15;

  /* brand — single continuous emerald ramp (hue ~162, no jumps) */
  --g-50:  236 250 245;
  --g-100: 208 243 229;
  --g-200: 165 231 206;
  --g-300: 108 213 177;
  --g-400:  52 190 146;
  --g-500:  16 163 122;
  --g-600:  10 133 100;
  --g-700:  11 106  81;
  --g-800:  13  85  66;
  --g-900:  13  69  55;
  --g-950:   3  38  30;

  /* supporting hues — only these five, one step apart in lightness */
  --r-100: 254 226 226; --r-200: 254 202 202; --r-400: 239  93  93;
  --r-500: 219  50  50; --r-600: 190  35  35; --r-700: 154  28  28; --r-950: 60 12 12;
  --a-100: 253 238 205; --a-200: 250 223 165; --a-400: 233 160  33;
  --a-500: 202 133  16; --a-600: 168 109  10; --a-700: 133  85   8; --a-950: 52 32 4;
  --b-100: 219 233 254; --b-200: 191 216 254; --b-400:  92 145 246;
  --b-500:  47 111 235; --b-600:  33  89 205; --b-700:  29  71 165; --b-950: 16 30 66;
  --v-100: 233 226 255; --v-200: 214 203 254; --v-400: 149 122 246;
  --v-500: 118  84 235; --v-600:  97  62 205; --v-700:  78  50 165; --v-950: 32 22 68;
  --t-100: 205 240 240; --t-200: 168 228 229; --t-400:  45 176 178;
  --t-500:  20 148 150; --t-600:  15 119 121; --t-700:  16  95  97; --t-950: 6 40 41;
}

/* ============ 2. SEMANTICS ========================================== */
:root, [data-theme="light"] {
  --canvas:        var(--n-50);
  --surface:       var(--n-0);
  --surface-sunk:  var(--n-100);
  --surface-hover: var(--n-100);
  --surface-active:var(--n-150);
  --ink:           var(--n-900);      /* inverted button / tooltip bg */
  --on-ink:        var(--n-0);
  --on-ink-dim:    var(--n-400);

  --fg:        var(--n-900);   /* 15.9:1 */
  --fg-muted:  var(--n-700);   /*  8.6:1 */
  --fg-subtle: var(--n-600);   /*  5.6:1  — smallest text still AA */
  --fg-faint:  var(--n-500);   /*  3.7:1  — non-essential / icons only */

  --line-subtle: var(--n-150);
  --line:        var(--n-200);
  --line-strong: var(--n-300);

  --accent:     var(--g-600);
  --accent-hi:  var(--g-500);
  --accent-fg:  var(--g-700);   /* accent-coloured text on light bg */
  --accent-bg:  var(--g-50);
  --accent-bd:  var(--g-200);

  --pos-fg: var(--g-700);  --pos: var(--g-500);  --pos-bg: var(--g-50);  --pos-bd: var(--g-200);
  --neg-fg: var(--r-700);  --neg: var(--r-500);  --neg-bg: var(--r-100); --neg-bd: var(--r-200);
  --warn-fg:var(--a-700);  --warn:var(--a-500);  --warn-bg:var(--a-100); --warn-bd:var(--a-200);
  --info-fg:var(--b-700);  --info:var(--b-500);  --info-bg:var(--b-100); --info-bd:var(--b-200);
  --alt-fg: var(--v-700);  --alt: var(--v-500);  --alt-bg: var(--v-100); --alt-bd: var(--v-200);
  --calm-fg:var(--t-700);  --calm:var(--t-500);  --calm-bg:var(--t-100); --calm-bd:var(--t-200);

  --grid: var(--n-200);          /* chart gridlines */
  --track: var(--n-150);         /* progress track */

  --e1: 0 1px 2px rgb(16 20 28 / .04);
  --e2: 0 1px 3px rgb(16 20 28 / .06), 0 4px 12px rgb(16 20 28 / .04);
  --e3: 0 8px 28px rgb(16 20 28 / .12), 0 2px 6px rgb(16 20 28 / .06);
  --ring: 0 0 0 2px rgb(var(--surface)), 0 0 0 4px rgb(var(--accent) / .55);
}

[data-theme="dark"] {
  --canvas:        var(--n-1000);
  --surface:       var(--n-900);
  --surface-sunk:  var(--n-950);
  --surface-hover: var(--n-850);
  --surface-active:var(--n-800);
  --ink:           var(--n-100);
  --on-ink:        var(--n-950);
  --on-ink-dim:    var(--n-600);

  --fg:        var(--n-25);
  --fg-muted:  var(--n-300);
  --fg-subtle: var(--n-400);
  --fg-faint:  var(--n-500);

  --line-subtle: var(--n-900);
  --line:        var(--n-850);
  --line-strong: var(--n-800);

  --accent:     var(--g-400);
  --accent-hi:  var(--g-300);
  --accent-fg:  var(--g-300);
  --accent-bg:  var(--g-950);
  --accent-bd:  var(--g-800);

  --pos-fg: var(--g-300);  --pos: var(--g-400);  --pos-bg: var(--g-950);  --pos-bd: var(--g-800);
  --neg-fg: 248 150 150;   --neg: var(--r-400);  --neg-bg: var(--r-950);  --neg-bd: 108 30 30;
  --warn-fg:250 210 130;   --warn:var(--a-400);  --warn-bg:var(--a-950);  --warn-bd:96 62 12;
  --info-fg:150 190 255;   --info:var(--b-400);  --info-bg:var(--b-950);  --info-bd:30 58 122;
  --alt-fg: 196 178 255;   --alt: var(--v-400);  --alt-bg: var(--v-950);  --alt-bd: 60 42 122;
  --calm-fg:130 220 220;   --calm:var(--t-400);  --calm-bg:var(--t-950);  --calm-bd:14 78 80;

  --grid: var(--n-850);
  --track: var(--n-850);

  --e1: none;
  --e2: 0 1px 2px rgb(0 0 0 / .4);
  --e3: 0 12px 32px rgb(0 0 0 / .55), 0 2px 8px rgb(0 0 0 / .4);
  --ring: 0 0 0 2px rgb(var(--surface)), 0 0 0 4px rgb(var(--accent) / .6);
}

/* ============ 3. SCALE ============================================== */
:root {
  /* space — 4pt grid, no arbitrary values anywhere below */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px;
  --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;

  /* type — integers only, no 11.5/12.5/13.5 blur */
  --t-micro: 11px; --t-xs: 12px; --t-sm: 13px; --t-base: 14px;
  --t-md: 16px; --t-lg: 20px; --t-xl: 26px; --t-2xl: 34px; --t-3xl: 44px;

  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-full: 999px;
  --ease: cubic-bezier(.2,.7,.3,1);
  --sidebar-w: 236px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* ============ base ================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: rgb(var(--canvas));
  color: rgb(var(--fg));
  font-family: "Inter var", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: var(--t-base);
  line-height: 1.5;
  letter-spacing: -0.006em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
svg { display: block; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }

/* every number in a finance app is tabular. non-negotiable. */
.num, .money, td.num, th.num, .stat-value, .figure, .amt { font-variant-numeric: tabular-nums; }

/* one visible focus treatment for the whole app */
:where(a, button, input, [tabindex]):focus-visible {
  outline: none;
  box-shadow: var(--ring);
  border-radius: var(--r-sm);
}

.icon, .icon-lg, .icon-sm {
  stroke: currentColor; fill: none; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
}
.icon { width: 18px; height: 18px; }
.icon-lg { width: 20px; height: 20px; }
.icon-sm { width: 15px; height: 15px; }

.u-label {
  font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: rgb(var(--fg-subtle));
}
.sr-only {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ============ 4. COMPONENTS ======================================== */

/* ---- shell ---- */
.shell { display: flex; min-height: 100vh; }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---- sidebar ---- */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: rgb(var(--canvas));
  border-right: 1px solid rgb(var(--line-subtle));
  display: flex; flex-direction: column;
  padding: var(--s5) var(--s3) var(--s3);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  transition: transform .22s var(--ease);
}
.brand { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2) var(--s6); }
.brand-mark {
  width: 26px; height: 26px; border-radius: var(--r-sm);
  background: rgb(var(--accent)); color: rgb(var(--n-0));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: var(--t-sm); letter-spacing: -.02em;
}
[data-theme="dark"] .brand-mark { color: rgb(var(--n-1000)); }
.brand-name { font-weight: 650; font-size: var(--t-md); letter-spacing: -.02em; }
.sidebar-close { margin-left: auto; display: none; width: 36px; height: 36px; border-radius: var(--r-sm); align-items: center; justify-content: center; color: rgb(var(--fg-subtle)); }

.nav-group { margin-bottom: var(--s5); }
.nav-group .u-label { padding: 0 var(--s2) var(--s2); display: block; color: rgb(var(--fg-faint)); }
.nav-item {
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s2); height: 36px; border-radius: var(--r-sm);
  color: rgb(var(--fg-muted)); font-size: var(--t-base); font-weight: 450;
  cursor: pointer; position: relative;
  transition: background .12s var(--ease), color .12s var(--ease);
}
.nav-item .icon { color: rgb(var(--fg-faint)); transition: color .12s var(--ease); }
.nav-item:hover { background: rgb(var(--surface-hover)); color: rgb(var(--fg)); }
.nav-item:hover .icon { color: rgb(var(--fg-muted)); }
.nav-item.active {
  background: rgb(var(--surface)); color: rgb(var(--fg)); font-weight: 550;
  box-shadow: var(--e1); border: 1px solid rgb(var(--line-subtle));
  padding: 0 calc(var(--s2) - 1px);
}
.nav-item.active .icon { color: rgb(var(--accent)); }
.nav-badge {
  margin-left: auto; font-size: var(--t-micro); font-weight: 600;
  background: rgb(var(--surface-active)); color: rgb(var(--fg-muted));
  border-radius: var(--r-full); min-width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center; padding: 0 5px;
}
.nav-badge.alert { background: rgb(var(--neg-bg)); color: rgb(var(--neg-fg)); }
.sidebar-spacer { flex: 1; min-height: var(--s6); }

.sidebar-foot {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s3) var(--s2) 0; margin-top: var(--s3);
  border-top: 1px solid rgb(var(--line-subtle));
}
.sidebar-foot-name { font-size: var(--t-sm); font-weight: 550; }
.sidebar-foot-sub { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); }
.avatar {
  width: 28px; height: 28px; border-radius: var(--r-full);
  background: rgb(var(--surface-active)); color: rgb(var(--fg-muted));
  font-size: var(--t-micro); font-weight: 650;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sidebar-backdrop { display: none; }

/* ---- topbar ---- */
.topbar {
  height: 56px; display: flex; align-items: center; gap: var(--s2);
  padding: 0 var(--s6); position: sticky; top: 0; z-index: 20;
  background: rgb(var(--canvas) / .85); backdrop-filter: blur(8px) saturate(1.4);
  border-bottom: 1px solid rgb(var(--line-subtle));
}
.topbar .menu-btn { display: none; }
.search {
  flex: 1; max-width: 380px; display: flex; align-items: center; gap: var(--s2);
  background: rgb(var(--surface)); border: 1px solid rgb(var(--line));
  border-radius: var(--r-sm); padding: 0 var(--s3); height: 34px;
  color: rgb(var(--fg-faint)); transition: border-color .12s var(--ease);
}
.search:focus-within { border-color: rgb(var(--accent) / .6); box-shadow: 0 0 0 3px rgb(var(--accent) / .12); }
.search input { border: none; background: transparent; outline: none; flex: 1; font-size: var(--t-sm); color: rgb(var(--fg)); min-width: 0; }
.search input::placeholder { color: rgb(var(--fg-faint)); }
.kbd {
  font-size: var(--t-micro); font-weight: 500; padding: 1px 5px; border-radius: 5px;
  border: 1px solid rgb(var(--line)); color: rgb(var(--fg-faint)); background: rgb(var(--surface-sunk));
}
.topbar-spacer { flex: 1; }
.icon-btn {
  width: 34px; height: 34px; border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  color: rgb(var(--fg-subtle)); position: relative; flex-shrink: 0;
  transition: background .12s var(--ease), color .12s var(--ease);
}
.icon-btn:hover { background: rgb(var(--surface-hover)); color: rgb(var(--fg)); }
.dot {
  position: absolute; top: 7px; right: 7px; width: 6px; height: 6px;
  border-radius: 50%; background: rgb(var(--neg)); box-shadow: 0 0 0 2px rgb(var(--canvas));
}

/* ---- page ---- */
.content { width: 100%; max-width: 1160px; margin: 0 auto; padding: var(--s8) var(--s6) var(--s12); }
.page-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s6); flex-wrap: wrap; }
.page-title { font-size: var(--t-lg); font-weight: 650; letter-spacing: -.022em; }
.page-sub { font-size: var(--t-sm); color: rgb(var(--fg-subtle)); }
.page-actions { display: flex; gap: var(--s2); margin-left: auto; }

/* section = the unit of the page. one heading, one body, no nesting. */
.section { margin-top: var(--s8); }
.section:first-child { margin-top: 0; }
.section-head { display: flex; align-items: baseline; gap: var(--s3); margin-bottom: var(--s3); }
.section-title { font-size: var(--t-base); font-weight: 600; letter-spacing: -.01em; }
.section-sub { font-size: var(--t-sm); color: rgb(var(--fg-subtle)); }
.section-action {
  margin-left: auto; font-size: var(--t-sm); font-weight: 550; color: rgb(var(--fg-muted));
  display: inline-flex; align-items: center; gap: var(--s1);
}
.section-action:hover { color: rgb(var(--fg)); }

.card { background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); border-radius: var(--r-lg); box-shadow: var(--e1); }
.card-pad { padding: var(--s5); }
.card-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s4); }
.card-title { font-size: var(--t-base); font-weight: 600; letter-spacing: -.01em; }
.card-sub { font-size: var(--t-xs); color: rgb(var(--fg-subtle)); }
.divider { height: 1px; background: rgb(var(--line-subtle)); margin: var(--s4) 0; }

.grid { display: grid; gap: var(--s4); }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-main { grid-template-columns: minmax(0,1.65fr) minmax(0,1fr); align-items: start; }
.stack { display: flex; flex-direction: column; gap: var(--s4); }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  font-size: var(--t-sm); font-weight: 550; border-radius: var(--r-sm);
  padding: 0 var(--s3); height: 34px; border: 1px solid transparent; white-space: nowrap;
  transition: background .12s var(--ease), border-color .12s var(--ease), transform .08s var(--ease);
}
.btn:active { transform: translateY(.5px); }
.btn-primary { background: rgb(var(--ink)); color: rgb(var(--on-ink)); }
.btn-primary:hover { background: rgb(var(--n-800)); }
[data-theme="dark"] .btn-primary:hover { background: rgb(var(--n-0)); }
.btn-secondary { background: rgb(var(--surface)); border-color: rgb(var(--line)); color: rgb(var(--fg-muted)); }
.btn-secondary:hover { background: rgb(var(--surface-hover)); color: rgb(var(--fg)); }
.btn-quiet { color: rgb(var(--fg-subtle)); }
.btn-quiet:hover { background: rgb(var(--surface-hover)); color: rgb(var(--fg)); }
.btn-lg { height: 40px; font-size: var(--t-base); padding: 0 var(--s4); }

.segment {
  display: inline-flex; background: rgb(var(--surface-sunk));
  border: 1px solid rgb(var(--line)); border-radius: var(--r-sm); padding: 2px; gap: 2px;
}
.segment button {
  font-size: var(--t-xs); font-weight: 550; padding: 0 var(--s3); height: 26px;
  border-radius: 6px; color: rgb(var(--fg-subtle)); transition: all .12s var(--ease);
}
.segment button:hover { color: rgb(var(--fg)); }
.segment button[aria-selected="true"] {
  background: rgb(var(--surface)); color: rgb(var(--fg));
  box-shadow: var(--e1); font-weight: 600;
}

/* ---- chips / tags ---- */
.chip {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: var(--t-xs); font-weight: 550; padding: 2px var(--s2);
  border-radius: 6px; white-space: nowrap;
}
.chip-pos  { background: rgb(var(--pos-bg));  color: rgb(var(--pos-fg)); }
.chip-neg  { background: rgb(var(--neg-bg));  color: rgb(var(--neg-fg)); }
.chip-warn { background: rgb(var(--warn-bg)); color: rgb(var(--warn-fg)); }
.chip-info { background: rgb(var(--info-bg)); color: rgb(var(--info-fg)); }
.chip-mute { background: rgb(var(--surface-sunk)); color: rgb(var(--fg-subtle)); }
.chip .icon-sm { width: 12px; height: 12px; stroke-width: 2.2; }

.tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--t-xs); font-weight: 500; color: rgb(var(--fg-muted));
}
.tag i { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }

/* ---- summary band (replaces the gradient hero) ---- */
.summary { display: flex; align-items: flex-start; gap: var(--s8); flex-wrap: wrap; }
.summary-main { min-width: 240px; }
.eyebrow { font-size: var(--t-sm); color: rgb(var(--fg-subtle)); }
.figure {
  font-size: var(--t-3xl); font-weight: 680; letter-spacing: -.035em;
  line-height: 1.05; margin-top: var(--s2); display: flex; align-items: baseline;
}
.figure .cents { font-size: var(--t-lg); font-weight: 600; color: rgb(var(--fg-faint)); letter-spacing: -.02em; }
.figure-meta { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3); font-size: var(--t-sm); color: rgb(var(--fg-subtle)); }
.summary-spark { flex: 1; min-width: 200px; max-width: 340px; align-self: flex-end; }

/* ---- stat ---- */
.stat { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s1); }
.stat-label { display: flex; align-items: center; gap: 6px; font-size: var(--t-sm); color: rgb(var(--fg-subtle)); font-weight: 500; }
.stat-label .icon-sm { color: rgb(var(--fg-faint)); }
.stat-value { font-size: var(--t-xl); font-weight: 660; letter-spacing: -.028em; line-height: 1.15; }
.stat-value.pos { color: rgb(var(--pos-fg)); }
.stat-value.neg { color: rgb(var(--neg-fg)); }
.stat-foot { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s1); font-size: var(--t-xs); color: rgb(var(--fg-subtle)); }
.stat-bar { height: 3px; border-radius: var(--r-full); background: rgb(var(--track)); margin-top: var(--s3); overflow: hidden; }
.stat-bar > i { display: block; height: 100%; border-radius: var(--r-full); }

/* ---- chart ---- */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart-axis { font-size: var(--t-micro); fill: rgb(var(--fg-faint)); font-variant-numeric: tabular-nums; }
.chart-grid { stroke: rgb(var(--grid)); stroke-width: 1; }
.legend { display: flex; gap: var(--s4); font-size: var(--t-xs); color: rgb(var(--fg-subtle)); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 3px, transparent 3px 6px); }
.tip {
  position: absolute; transform: translate(-50%, -100%);
  background: rgb(var(--ink)); color: rgb(var(--on-ink));
  border-radius: var(--r-sm); padding: 6px var(--s3); font-size: var(--t-xs);
  box-shadow: var(--e3); white-space: nowrap; pointer-events: none;
}
.tip::after {
  content: ""; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px;
  background: rgb(var(--ink)); transform: translateX(-50%) rotate(45deg); border-radius: 1px;
}
.tip .big { font-size: var(--t-sm); font-weight: 650; font-variant-numeric: tabular-nums; }
.tip .sub { color: rgb(var(--on-ink-dim)); }

/* ---- bar list (categories, week rhythm) ---- */
.blist { display: flex; flex-direction: column; }
.brow { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0; }
.brow-main { flex: 1; min-width: 0; }
.brow-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin-bottom: 6px; font-size: var(--t-sm); }
.brow-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow-val { color: rgb(var(--fg-muted)); font-weight: 550; font-variant-numeric: tabular-nums; }
.track { height: 6px; border-radius: var(--r-full); background: rgb(var(--track)); overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: var(--r-full); transition: width .4s var(--ease); }
.cat-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* column chart — real values, real baseline */
.bars { display: flex; align-items: flex-end; gap: var(--s2); position: relative; padding-top: var(--s5); }
.bars-avg { position: absolute; left: 0; right: 0; border-top: 1px dashed rgb(var(--line-strong)); }
.bars-avg span { position: absolute; right: 0; bottom: 3px; font-size: var(--t-micro); color: rgb(var(--fg-faint)); }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bar-val { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); font-variant-numeric: tabular-nums; }
.bar-fill { width: 100%; background: rgb(var(--info)); opacity: .3; border-radius: 5px 5px 2px 2px; }
.bar-day { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); }
.bar.hi .bar-fill { opacity: 1; }
.bar.hi .bar-val, .bar.hi .bar-day { color: rgb(var(--fg)); font-weight: 600; }

/* budget track with a "should be here today" marker */
.budget { padding: var(--s3) 0; border-top: 1px solid rgb(var(--line-subtle)); }
.budget:first-child { border-top: none; padding-top: 0; }
.budget-track { position: relative; height: 6px; border-radius: var(--r-full); background: rgb(var(--track)); }
.budget-fill { position: absolute; top: 0; left: 0; bottom: 0; border-radius: var(--r-full); }
.budget-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: rgb(var(--fg)); border-radius: 2px; opacity: .55; }

/* ---- transaction list (same component desktop + mobile) ---- */
.tlist { display: flex; flex-direction: column; }
.tgroup-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: var(--s4) 0 var(--s2); font-size: var(--t-xs);
  color: rgb(var(--fg-subtle)); font-weight: 550;
  position: sticky; top: 56px; background: rgb(var(--surface)); z-index: 1;
}
.tgroup-head:first-child { padding-top: 0; }
.trow {
  display: grid; align-items: center; gap: var(--s3);
  grid-template-columns: 1fr 132px 128px 112px 32px;
  padding: var(--s3) var(--s2); margin: 0 calc(var(--s2) * -1);
  border-radius: var(--r-md); border-top: 1px solid rgb(var(--line-subtle));
  transition: background .1s var(--ease);
}
.trow:hover { background: rgb(var(--surface-hover)); }
.trow:hover .trow-actions { opacity: 1; }
.tlist .trow:first-of-type { border-top: none; }
.tlead { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.tavatar {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t-xs); font-weight: 650;
}
.tname { font-size: var(--t-base); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tsub { font-size: var(--t-xs); color: rgb(var(--fg-subtle)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tmeta { font-size: var(--t-sm); color: rgb(var(--fg-muted)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { text-align: right; font-size: var(--t-base); font-weight: 600; letter-spacing: -.01em; }
.amt.neg { color: rgb(var(--fg)); }
.amt.pos { color: rgb(var(--pos-fg)); }
.trow-actions { opacity: 0; transition: opacity .12s var(--ease); }
.trow:focus-within .trow-actions { opacity: 1; }

/* plain data table (merchants, accounts) */
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: var(--t-xs); font-weight: 550;
  color: rgb(var(--fg-subtle)); padding: 0 var(--s3) var(--s2); white-space: nowrap;
}
th.num, td.num { text-align: right; }
td { padding: var(--s3); font-size: var(--t-sm); vertical-align: middle; border-top: 1px solid rgb(var(--line-subtle)); }
tbody tr:hover { background: rgb(var(--surface-hover)); }
td:first-child, th:first-child { padding-left: 0; }
td:last-child, th:last-child { padding-right: 0; }

/* ---- filters ---- */
.filters { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.filters .search { max-width: 260px; }
.filter-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 var(--s3);
  border-radius: var(--r-sm); border: 1px solid rgb(var(--line));
  font-size: var(--t-sm); font-weight: 500; color: rgb(var(--fg-muted));
  background: rgb(var(--surface)); transition: all .12s var(--ease);
}
.filter-btn:hover { background: rgb(var(--surface-hover)); color: rgb(var(--fg)); }
.filter-btn .count {
  background: rgb(var(--accent-bg)); color: rgb(var(--accent-fg));
  font-size: var(--t-micro); font-weight: 650; border-radius: var(--r-full);
  min-width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; padding: 0 4px;
}

/* ---- notice ---- */
.notice {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4); border-radius: var(--r-md);
  background: rgb(var(--surface)); border: 1px solid rgb(var(--line));
  border-left: 3px solid rgb(var(--warn));
}
.notice-title { font-size: var(--t-sm); font-weight: 600; }
.notice-sub { font-size: var(--t-sm); color: rgb(var(--fg-subtle)); }
.notice .icon-wrap { color: rgb(var(--warn)); display: flex; }

/* ---- account cards ---- */
.acct {
  padding: var(--s4); border-radius: var(--r-lg); background: rgb(var(--surface));
  border: 1px solid rgb(var(--line)); box-shadow: var(--e1);
  display: flex; flex-direction: column; gap: var(--s3);
  transition: border-color .12s var(--ease), box-shadow .12s var(--ease);
}
.acct:hover { border-color: rgb(var(--line-strong)); box-shadow: var(--e2); }
.acct-top { display: flex; align-items: center; gap: var(--s2); }
.acct-mark {
  width: 32px; height: 32px; border-radius: 9px; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.acct-name { font-size: var(--t-sm); font-weight: 550; }
.acct-sub { font-size: var(--t-xs); color: rgb(var(--fg-subtle)); }
.acct-bal { font-size: var(--t-lg); font-weight: 650; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.acct-foot { display: flex; align-items: center; justify-content: space-between; font-size: var(--t-xs); color: rgb(var(--fg-subtle)); }
.acct.add {
  border-style: dashed; box-shadow: none; align-items: center; justify-content: center;
  color: rgb(var(--fg-subtle)); font-size: var(--t-sm); font-weight: 500; min-height: 132px;
}
.acct.add:hover { color: rgb(var(--fg)); border-color: rgb(var(--accent)); }

/* the one place a card face is allowed — the featured account */
.acct-feature {
  color: rgb(var(--n-0)); border: none;
  background:
    radial-gradient(120% 140% at 88% 0%, rgb(var(--g-500) / .9), transparent 62%),
    linear-gradient(150deg, rgb(var(--n-850)), rgb(var(--n-950)));
  box-shadow: var(--e2);
}
.acct-feature .acct-sub, .acct-feature .acct-foot { color: rgb(var(--n-0) / .62); }
.acct-feature .acct-mark { background: rgb(255 255 255 / .12); color: rgb(var(--n-0)); }

/* ---- people / settlement ---- */
.prow { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid rgb(var(--line-subtle)); }
.prow:first-child { border-top: none; padding-top: 0; }
.pname { font-size: var(--t-sm); font-weight: 500; }
.psub { font-size: var(--t-xs); color: rgb(var(--fg-subtle)); }
.pamt { margin-left: auto; font-size: var(--t-base); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---- empty / skeleton states ---- */
.empty { text-align: center; padding: var(--s10) var(--s4); color: rgb(var(--fg-subtle)); }
.empty-title { font-size: var(--t-base); font-weight: 550; color: rgb(var(--fg)); margin-top: var(--s3); }
.empty-sub { font-size: var(--t-sm); margin-top: var(--s1); }
.skel { background: rgb(var(--surface-sunk)); border-radius: 6px; animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }

/* ---- mobile-only chrome ---- */
.tabbar, .fab { display: none; }

/* ============ 5. RESPONSIVE ======================================== */
@media (max-width: 1080px) {
  .g-main { grid-template-columns: minmax(0,1fr); }
  .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (max-width: 860px) {
  .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .trow { grid-template-columns: 1fr 112px 104px 32px; }
  .trow .col-hide-md { display: none; }
}

@media (max-width: 680px) {
  :root { --t-3xl: 36px; --t-2xl: 28px; }

  /* sidebar becomes a drawer */
  .sidebar {
    position: fixed; z-index: 60; left: 0; top: 0; width: 280px;
    background: rgb(var(--surface)); box-shadow: var(--e3);
    transform: translateX(-102%);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-close { display: flex; }
  .sidebar-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
  .sidebar-backdrop.show { display: block; opacity: 1; pointer-events: auto; }

  .topbar .menu-btn { display: flex; }
  .topbar { padding: 0 var(--s4); }
  .card-head { flex-wrap: wrap; }
  .card-head .segment { margin-left: 0 !important; width: 100%; }
  .card-head .segment button { flex: 1; }
  .topbar .search { max-width: none; }
  .kbd { display: none; }

  .content { padding: var(--s5) var(--s4) 96px; }
  .section { margin-top: var(--s6); }
  .card-pad { padding: var(--s4); }
  .g2, .g3, .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s3); }
  .g-1-on-mobile { grid-template-columns: minmax(0,1fr) !important; }
  .page-actions { display: none; }          /* replaced by the FAB */
  .summary { gap: var(--s5); }
  .summary-spark { max-width: none; width: 100%; }

  /* transactions: two-line row, amount right — no 5-line stacked card */
  .trow {
    grid-template-columns: 1fr auto; gap: var(--s3);
    padding: var(--s3) var(--s2); align-items: center;
  }
  .trow .col-mobile-hide { display: none; }
  .tavatar { width: 38px; height: 38px; }
  .trow-actions { display: none; }
  .tgroup-head { top: 0; }

  /* bottom tab bar — thumb-reachable primary nav */
  .tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgb(var(--surface) / .92); backdrop-filter: blur(12px) saturate(1.4);
    border-top: 1px solid rgb(var(--line));
    padding: 6px var(--s2) calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 550; color: rgb(var(--fg-faint)); padding: 6px 0; border-radius: var(--r-sm);
  }
  .tabbar a .icon { width: 21px; height: 21px; }
  .tabbar a.active { color: rgb(var(--accent)); }

  .fab {
    display: flex; position: fixed; right: var(--s4); bottom: calc(72px + env(safe-area-inset-bottom));
    z-index: 51; width: 52px; height: 52px; border-radius: var(--r-full);
    background: rgb(var(--ink)); color: rgb(var(--on-ink));
    align-items: center; justify-content: center; box-shadow: var(--e3);
  }
  .fab .icon { width: 22px; height: 22px; stroke-width: 2.2; }

  th.col-md, td.col-md { display: none; }
  .hide-mobile { display: none !important; }
}

@media (max-width: 420px) {
  .g2.g-tight-mobile, .g4 { grid-template-columns: minmax(0,1fr); }
}

/* =====================================================================
   v3 ADDITIONS — module shell, global search, popovers, donut
   ===================================================================== */

/* ---- module switcher (Daybook is multi-module: Tasks, Wallet, …) ---- */
.modswitch {
  display: flex; align-items: center; gap: var(--s2); width: 100%;
  padding: var(--s2); border-radius: var(--r-md);
  border: 1px solid rgb(var(--line)); background: rgb(var(--surface));
  margin-bottom: var(--s5); text-align: left;
  transition: border-color .12s var(--ease), box-shadow .12s var(--ease);
}
.modswitch:hover { border-color: rgb(var(--line-strong)); box-shadow: var(--e1); }
.modswitch-mark {
  width: 28px; height: 28px; border-radius: var(--r-sm); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgb(var(--accent-bg)); color: rgb(var(--accent-fg));
}
.modswitch-name { font-size: var(--t-sm); font-weight: 600; line-height: 1.2; }
.modswitch-sub { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); }
.modswitch .chev { margin-left: auto; color: rgb(var(--fg-faint)); }

/* ---- popover menu ---- */
.pop-anchor { position: relative; }
.menu {
  position: absolute; z-index: 70; min-width: 236px;
  background: rgb(var(--surface)); border: 1px solid rgb(var(--line));
  border-radius: var(--r-md); box-shadow: var(--e3); padding: var(--s1);
  display: none;
}
.menu.open { display: block; }
.menu-label {
  font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: rgb(var(--fg-faint));
  padding: var(--s2) var(--s3) var(--s1);
}
.menu-item {
  display: flex; align-items: center; gap: var(--s3); width: 100%;
  padding: var(--s2) var(--s3); border-radius: var(--r-sm);
  font-size: var(--t-sm); color: rgb(var(--fg-muted)); text-align: left;
}
.menu-item:hover { background: rgb(var(--surface-hover)); color: rgb(var(--fg)); }
.menu-item .icon-sm { color: rgb(var(--fg-faint)); }
.menu-item.active { color: rgb(var(--fg)); font-weight: 550; }
.menu-item.active .icon-sm { color: rgb(var(--accent)); }
.menu-item .trail { margin-left: auto; font-size: var(--t-micro); color: rgb(var(--fg-faint)); }
.menu-sep { height: 1px; background: rgb(var(--line-subtle)); margin: var(--s1) 0; }

/* ---- global search with a module scope ---- */
.search-scope {
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
  font-size: var(--t-xs); font-weight: 550; color: rgb(var(--fg-muted));
  background: rgb(var(--surface-sunk)); border-radius: 6px; padding: 2px 6px;
}
.search-scope .icon-sm { width: 12px; height: 12px; color: rgb(var(--fg-faint)); }
/* the toolbar filter field is visually distinct from global search */
.filter-field {
  display: flex; align-items: center; gap: var(--s2); height: 34px;
  padding: 0 var(--s3); border-radius: var(--r-sm);
  background: rgb(var(--surface-sunk)); border: 1px solid transparent;
  color: rgb(var(--fg-faint)); flex: 1; max-width: 280px;
}
.filter-field:focus-within { background: rgb(var(--surface)); border-color: rgb(var(--accent) / .6); box-shadow: 0 0 0 3px rgb(var(--accent) / .12); }
.filter-field input { border: none; background: transparent; outline: none; flex: 1; font-size: var(--t-sm); color: rgb(var(--fg)); min-width: 0; }

/* ---- stat card (In / Out / Net as separate cards) ---- */
.stat-card { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s4) var(--s5); }
.stat-card .stat-icon {
  width: 30px; height: 30px; border-radius: var(--r-sm); margin-bottom: var(--s2);
  display: flex; align-items: center; justify-content: center;
}

/* ---- donut ---- */
.donut-wrap { display: flex; align-items: center; gap: var(--s6); flex-wrap: wrap; }
.donut { position: relative; flex-shrink: 0; width: 176px; height: 176px; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 22; transition: stroke-width .15s var(--ease); }
.donut-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}
.donut-center .k { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); font-weight: 550; }
.donut-center .v { font-size: var(--t-lg); font-weight: 660; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.donut-legend { flex: 1; min-width: 190px; display: flex; flex-direction: column; }
.dl-row { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) 0; border-top: 1px solid rgb(var(--line-subtle)); font-size: var(--t-sm); }
.dl-row:first-child { border-top: none; }
.dl-row i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.dl-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dl-row .p { margin-left: auto; color: rgb(var(--fg-subtle)); font-variant-numeric: tabular-nums; }
.dl-row .a { width: 78px; text-align: right; font-weight: 550; font-variant-numeric: tabular-nums; }

/* ---- day group header aligned to the amount column ---- */
.tgroup-head {
  display: grid; grid-template-columns: 1fr 132px 128px 112px 32px;
  gap: var(--s3); align-items: baseline;
  padding: var(--s5) var(--s2) var(--s2); margin: 0 calc(var(--s2) * -1);
  font-size: var(--t-xs); color: rgb(var(--fg-subtle)); font-weight: 550;
  position: sticky; top: 56px; background: rgb(var(--surface)); z-index: 1;
}
.tgroup-head:first-child { padding-top: 0; }
.tgroup-head .tg-date { grid-column: 1; }
.tgroup-head .tg-date b { color: rgb(var(--fg)); font-weight: 600; font-size: var(--t-sm); }
.tgroup-head .tg-total { grid-column: 4; text-align: right; font-variant-numeric: tabular-nums; }
.tgroup-head .tg-total b { display: block; color: rgb(var(--fg-muted)); font-weight: 600; font-size: var(--t-sm); }

@media (max-width: 860px) {
  .tgroup-head { grid-template-columns: 1fr 112px 104px 32px; }
  .tgroup-head .tg-total { grid-column: 3; }
}
@media (max-width: 680px) {
  .tgroup-head { grid-template-columns: 1fr auto; top: 0; padding: var(--s4) var(--s2) var(--s2); }
  .tgroup-head .tg-total { grid-column: 2; }
  .modswitch { margin-bottom: var(--s4); }
  .donut-wrap { gap: var(--s4); }
  .donut { width: 148px; height: 148px; margin: 0 auto; }
  .menu { left: 0 !important; right: 0 !important; min-width: 0; }
}

/* --- v3 fixes --- */
.modswitch > span:nth-child(2) { display: flex; flex-direction: column; min-width: 0; }
.modswitch-name, .modswitch-sub { display: block; }
.dl-row .n { flex: 1; min-width: 0; }
.dl-row .a { width: 88px; text-align: right; }
.dl-row .p { width: 46px; text-align: right; margin-left: var(--s3); }
.tgroup-head .tg-total b { display: inline; margin-left: 6px; }
.donut-center { padding: 0 var(--s6); }
@media (max-width: 680px) { .donut-center .v { font-size: var(--t-md); } }

/* =====================================================================
   v4 — one page grid. every card lands on the same 12 columns with one
   gap value, and rows stretch so neighbours are always equal height.
   ===================================================================== */
.dash {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: var(--s5); align-items: stretch;
}
.dash > * { min-width: 0; }
.dash > .card, .dash > section > .card { height: 100%; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; }
.c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; } .c8 { grid-column: span 8; }
.c12 { grid-column: span 12; }
/* a titled block that still stretches with its row */
.block { display: flex; flex-direction: column; }
.block > .card { flex: 1; }

@media (max-width: 1080px) {
  .c3, .c4, .c5, .c6, .c7 { grid-column: span 6; }
  .c8, .c12 { grid-column: span 12; }
}
@media (max-width: 680px) {
  .dash { gap: var(--s4); }
  .c3, .c4, .c5, .c6, .c7, .c8, .c12 { grid-column: span 12; }
}

/* ---- hero (brought back, on the corrected ramp so there's no seam) ---- */
.hero {
  position: relative; overflow: hidden; color: #fff;
  border-radius: var(--r-lg); padding: var(--s6);
  display: flex; flex-direction: column;
  background: linear-gradient(135deg, rgb(var(--g-700)) 0%, rgb(var(--g-600)) 45%, rgb(var(--g-400)) 100%);
}
[data-theme="dark"] .hero {
  background: linear-gradient(135deg, rgb(var(--g-900)) 0%, rgb(var(--g-700)) 55%, rgb(var(--g-500)) 100%);
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(520px 260px at 88% -20%, rgb(255 255 255 / .22), transparent 62%),
    radial-gradient(320px 220px at 102% 108%, rgb(255 255 255 / .12), transparent 60%);
}
.hero > * { position: relative; z-index: 1; }
.hero-eyebrow { font-size: var(--t-sm); color: rgb(255 255 255 / .82); }
.hero-greeting {
  font-size: var(--t-lg); font-weight: 650; letter-spacing: -.02em;
  margin-top: var(--s1); line-height: 1.25;
}
.hero-figure {
  font-size: var(--t-3xl); font-weight: 680; letter-spacing: -.035em;
  line-height: 1.05; display: flex; align-items: baseline; font-variant-numeric: tabular-nums;
}
.hero-figure .cents { font-size: var(--t-lg); font-weight: 600; color: rgb(255 255 255 / .62); letter-spacing: -.02em; }
.hero-row { display: flex; align-items: flex-end; gap: var(--s5); flex-wrap: wrap; margin-top: var(--s5); }
.hero-actions { display: flex; gap: var(--s2); margin-left: auto; flex-wrap: wrap; }
.chip-glass { background: rgb(255 255 255 / .18); color: #fff; }
.btn-glass {
  background: rgb(255 255 255 / .16); color: #fff;
  border-color: rgb(255 255 255 / .26); backdrop-filter: blur(4px);
}
.btn-glass:hover { background: rgb(255 255 255 / .26); }
.btn-solid-light { background: #fff; color: rgb(var(--g-800)); }
.btn-solid-light:hover { background: rgb(255 255 255 / .9); }
.hero-stats {
  display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
  gap: var(--s4); margin-top: auto; padding-top: var(--s5);
  border-top: 1px solid rgb(255 255 255 / .2);
}
.hero-stat-k { font-size: var(--t-xs); color: rgb(255 255 255 / .78); }
.hero-stat-v { font-size: var(--t-lg); font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.hero-stat-s { font-size: var(--t-micro); color: rgb(255 255 255 / .7); margin-top: 2px; }
@media (max-width: 680px) {
  .hero { padding: var(--s5); }
  .hero-actions { margin-left: 0; width: 100%; }
  .hero-actions .btn { flex: 1; }
  .hero-stats { grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--s2); }
  .hero-stat-v { font-size: var(--t-md); }
}

/* =====================================================================
   v5 — app bar. Modules live in the bar as icon tabs (hover for the
   name, underline for the active one). The sidebar is now only the
   current module's own navigation.
   ===================================================================== */
.appbar {
  position: sticky; top: 0; z-index: 60; height: 56px;
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s4);
  background: rgb(var(--surface));
  border-bottom: 1px solid rgb(var(--line));
}
.appbar-left { display: flex; align-items: center; gap: var(--s2); flex: 1; min-width: 0; }
.appbar-right { display: flex; align-items: center; gap: var(--s2); flex: 1; justify-content: flex-end; }
.appbar-logo {
  width: 36px; height: 36px; border-radius: var(--r-full); flex-shrink: 0;
  background: rgb(var(--accent)); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 750; font-size: var(--t-md); letter-spacing: -.03em;
}
[data-theme="dark"] .appbar-logo { color: rgb(var(--n-1000)); }
.appbar .search {
  max-width: 268px; height: 38px; border-radius: var(--r-full);
  background: rgb(var(--surface-sunk)); border-color: transparent;
}
.appbar .search:focus-within { background: rgb(var(--surface)); border-color: rgb(var(--accent) / .6); }

/* module tabs — centred, icon-only, name on hover */
.modtabs { display: flex; align-items: stretch; height: 100%; gap: var(--s1); }
.modtab {
  position: relative; width: 104px; height: 100%;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-sm); color: rgb(var(--fg-subtle));
  transition: background .12s var(--ease), color .12s var(--ease);
}
.modtab .icon { width: 24px; height: 24px; stroke-width: 1.6; }
.modtab:hover { background: rgb(var(--surface-hover)); color: rgb(var(--fg-muted)); }
.modtab[aria-current="page"] { color: rgb(var(--accent)); background: none; }
.modtab[aria-current="page"]::before {
  content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 3px;
  border-radius: 3px 3px 0 0; background: rgb(var(--accent));
}
.modtab .count {
  position: absolute; top: 8px; right: 26px;
  background: rgb(var(--neg)); color: #fff; font-size: 10px; font-weight: 700;
  min-width: 16px; height: 16px; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center; padding: 0 4px;
  box-shadow: 0 0 0 2px rgb(var(--surface));
}
/* tooltip */
.tip-label {
  position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(-4px);
  background: rgb(var(--ink)); color: rgb(var(--on-ink));
  font-size: var(--t-xs); font-weight: 500; padding: 5px var(--s2);
  border-radius: 6px; white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity .12s var(--ease), transform .12s var(--ease);
  box-shadow: var(--e2); z-index: 5;
}
.modtab:hover .tip-label, .circle-btn:hover .tip-label { opacity: 1; transform: translateX(-50%) translateY(0); }

/* circular right-hand actions, Facebook-style */
.circle-btn {
  position: relative; width: 40px; height: 40px; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  background: rgb(var(--surface-sunk)); color: rgb(var(--fg));
  transition: background .12s var(--ease);
}
.circle-btn:hover { background: rgb(var(--surface-active)); }
.circle-btn .icon { width: 20px; height: 20px; }
.circle-btn .count {
  position: absolute; top: -2px; right: -2px;
  background: rgb(var(--neg)); color: #fff; font-size: 10px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center; padding: 0 5px;
  box-shadow: 0 0 0 2px rgb(var(--surface));
}
.avatar-btn { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
.avatar-btn .avatar { width: 40px; height: 40px; font-size: var(--t-sm); }
.avatar-btn .caret {
  position: absolute; right: -2px; bottom: -2px; width: 17px; height: 17px;
  border-radius: var(--r-full); background: rgb(var(--surface-active));
  color: rgb(var(--fg)); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 2px rgb(var(--surface));
}
.avatar-btn .caret svg { width: 11px; height: 11px; stroke-width: 3; }

/* ---- account menu (two panes: root and settings) ---- */
.menu-panel {
  position: absolute; right: 0; top: calc(100% + 10px); z-index: 70;
  width: 328px; max-height: calc(100vh - 76px); overflow-y: auto;
  background: rgb(var(--surface)); border: 1px solid rgb(var(--line));
  border-radius: var(--r-lg); box-shadow: var(--e3); padding: var(--s2);
  display: none;
}
.menu-panel.open { display: block; }
.menu-card {
  border: 1px solid rgb(var(--line-subtle)); border-radius: var(--r-md);
  padding: var(--s2); box-shadow: var(--e1); margin-bottom: var(--s2);
}
.menu-you {
  display: flex; align-items: center; gap: var(--s3); width: 100%;
  padding: var(--s2); border-radius: var(--r-sm); text-align: left;
}
.menu-you:hover { background: rgb(var(--surface-hover)); }
.menu-you .avatar { width: 36px; height: 36px; font-size: var(--t-xs); }
.menu-you-name { font-size: var(--t-base); font-weight: 600; }
.menu-you-sub { font-size: var(--t-xs); color: rgb(var(--fg-subtle)); }
.menu-hr { height: 1px; background: rgb(var(--line-subtle)); margin: var(--s2) var(--s2); }
.menu-wide {
  display: flex; align-items: center; gap: var(--s3); width: 100%;
  padding: var(--s2); border-radius: var(--r-sm); text-align: left;
  font-size: var(--t-base); color: rgb(var(--fg));
}
.menu-wide:hover { background: rgb(var(--surface-hover)); }
.menu-wide .bubble {
  width: 36px; height: 36px; border-radius: var(--r-full); flex-shrink: 0;
  background: rgb(var(--surface-sunk)); color: rgb(var(--fg));
  display: flex; align-items: center; justify-content: center;
}
.menu-wide .bubble .icon { width: 19px; height: 19px; }
.menu-wide .chev { margin-left: auto; color: rgb(var(--fg-faint)); }
.menu-wide .sub { display: block; font-size: var(--t-xs); color: rgb(var(--fg-subtle)); }
.menu-btn-wide {
  display: flex; align-items: center; justify-content: center; gap: var(--s2);
  width: 100%; padding: var(--s2); border-radius: var(--r-sm);
  background: rgb(var(--surface-sunk)); font-size: var(--t-sm); font-weight: 600;
}
.menu-btn-wide:hover { background: rgb(var(--surface-active)); }
.menu-foot {
  font-size: var(--t-micro); color: rgb(var(--fg-faint));
  padding: var(--s3) var(--s3) var(--s2); line-height: 1.6;
}
.menu-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s1) var(--s2) var(--s3); }
.menu-head .title { font-size: var(--t-md); font-weight: 650; }
.pane { display: none; }
.pane.show { display: block; }

/* ---- sidebar is now module-scoped ---- */
.shell { align-items: flex-start; }
.sidebar { top: 56px; height: calc(100vh - 56px); border-right: 1px solid rgb(var(--line-subtle)); }
.module-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s1) var(--s2) var(--s5); }
.module-head-mark {
  width: 30px; height: 30px; border-radius: var(--r-sm);
  background: rgb(var(--accent-bg)); color: rgb(var(--accent-fg));
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.module-head-name { font-size: var(--t-md); font-weight: 650; letter-spacing: -.02em; }
.module-head-sub { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); }

@media (max-width: 980px) { .modtab { width: 76px; } .appbar .search { max-width: 200px; } }
@media (max-width: 820px) {
  .modtabs { display: none; }
  .appbar-right, .appbar-left { flex: 0 0 auto; }
  .appbar .search { flex: 1; max-width: none; }
  .appbar { gap: var(--s2); }
}
@media (max-width: 680px) {
  .appbar { padding: 0 var(--s3); }
  .appbar-logo { width: 32px; height: 32px; }
  .circle-btn { width: 36px; height: 36px; }
  .avatar-btn, .avatar-btn .avatar { width: 36px; height: 36px; }
  .menu-panel { position: fixed; left: var(--s3); right: var(--s3); top: 62px; width: auto; }
  .sidebar { top: 0; height: 100vh; }
}
.appbar .menu-btn { display: none; }
.appbar { position: sticky; }
.modtabs { position: absolute; left: 50%; transform: translateX(-50%); top: 0; }
@media (max-width: 680px) { .appbar .menu-btn { display: flex; } }
@media (max-width: 820px) {
  .appbar-left { flex: 1 1 auto; min-width: 0; }
  .appbar-right { flex: 0 0 auto; }
}
@media (max-width: 680px) {
  .appbar-right .circle-btn:first-of-type { display: none; }  /* quick-add lives in the FAB */
  .appbar .search { flex: 1 1 auto; min-width: 0; }
}

/* =====================================================================
   v6 — actions moved to the page header, day totals as a quiet pill,
   search that expands on focus instead of sprouting a box inside itself
   ===================================================================== */

/* ---- search: one field. focus grows it and lifts it. ---- */
.appbar .search {
  transition: max-width .24s var(--ease), box-shadow .2s var(--ease),
              background .2s var(--ease), transform .24s var(--ease);
  transform-origin: left center;
}
.appbar .search:focus-within {
  max-width: 420px; transform: scale(1.02);
  background: rgb(var(--surface));
  border-color: rgb(var(--line));
  box-shadow: var(--e3);
}
.appbar .search:focus-within .icon-sm { color: rgb(var(--accent)); }
.appbar .search .icon-sm { transition: color .2s var(--ease); }

/* ---- day total: no label, just the number, on a soft overlay ---- */
.tgroup-head { padding-top: var(--s4); }
.tgroup-head .tg-total {
  justify-self: end; display: inline-flex; align-items: center;
  padding: 3px var(--s2); border-radius: 6px;
  background: rgb(var(--surface-sunk));
  font-size: var(--t-sm); font-weight: 600; color: rgb(var(--fg));
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.tgroup-head .tg-total.pos { background: rgb(var(--pos-bg)); color: rgb(var(--pos-fg)); }

/* ---- hero: figure left, the three numbers right of a hairline ---- */
.hero-body { display: flex; gap: var(--s6); align-items: center; margin-top: var(--s5); }
.hero-main { flex: 1; min-width: 0; }
.hero-figure-row { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.hero-stats {
  display: flex; flex-direction: column; gap: var(--s4);
  padding-left: var(--s6); border-left: 1px solid rgb(255 255 255 / .22);
  flex-shrink: 0; min-width: 176px;
  border-top: none; margin: 0; padding-top: 0;
}
.hero-stats > div { display: flex; align-items: baseline; gap: var(--s3); }
.hero-stat-k { flex: 1; }
.hero-stat-v { margin-top: 0; font-size: var(--t-md); }
@media (max-width: 900px) {
  .hero-body { flex-direction: column; align-items: stretch; gap: var(--s5); }
  .hero-stats {
    flex-direction: row; padding-left: 0; padding-top: var(--s4);
    border-left: none; border-top: 1px solid rgb(255 255 255 / .22);
  }
  .hero-stats > div { flex: 1; flex-direction: column; gap: 2px; }
}
/* the wrapper shows focus — the input must not draw a second box inside it */
.search input:focus-visible, .filter-field input:focus-visible { box-shadow: none; }

/* =====================================================================
   v7 — motion layer. Same curve and the same three durations everywhere,
   so the whole product feels like one material.
     fast  120ms  colour / opacity swaps
     base  200ms  size, elevation, position
     slow  280ms  things that grow (search, panels, charts)
   ===================================================================== */
:root { --dur-fast: 120ms; --dur-base: 200ms; --dur-slow: 280ms; }

/* ---- buttons: colour fast, lift on hover, press down ---- */
.btn, .filter-btn, .menu-btn-wide {
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease),
              color var(--dur-fast) var(--ease), box-shadow var(--dur-base) var(--ease),
              transform var(--dur-fast) var(--ease);
}
.btn:hover, .filter-btn:hover { transform: translateY(-1px); }
.btn-primary:hover { box-shadow: var(--e2); }
.btn:active, .filter-btn:active, .menu-btn-wide:active { transform: translateY(0) scale(.985); }

/* ---- circular bar actions ---- */
.circle-btn, .icon-btn, .avatar-btn {
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease),
              transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
}
.circle-btn:hover, .avatar-btn:hover { transform: scale(1.06); }
.circle-btn:active, .icon-btn:active, .avatar-btn:active { transform: scale(.94); }
.icon-btn:hover { transform: scale(1.08); }

/* ---- module tabs: icon rises, underline wipes in ---- */
.modtab .icon { transition: transform var(--dur-base) var(--ease); }
.modtab:hover .icon { transform: translateY(-2px) scale(1.06); }
.modtab::before { transition: transform var(--dur-slow) var(--ease), opacity var(--dur-base) var(--ease); }
.modtab[aria-current="page"]::before { animation: wipe var(--dur-slow) var(--ease) both; }
@keyframes wipe { from { transform: scaleX(.2); opacity: 0 } to { transform: scaleX(1); opacity: 1 } }

/* ---- segmented control: the thumb slides in feel ---- */
.segment button {
  transition: background var(--dur-base) var(--ease), color var(--dur-fast) var(--ease),
              box-shadow var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.segment button:active { transform: scale(.96); }

/* ---- nav + menus ---- */
.nav-item, .menu-item, .menu-wide, .menu-you, .section-action, .tabbar a {
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease),
              transform var(--dur-base) var(--ease);
}
.nav-item:hover, .menu-wide:hover, .menu-you:hover { transform: translateX(2px); }
.section-action:hover { transform: translateX(2px); }
.menu-wide .bubble { transition: background var(--dur-fast) var(--ease), transform var(--dur-base) var(--ease); }
.menu-wide:hover .bubble { transform: scale(1.08); }
.menu-panel { animation: pop var(--dur-base) var(--ease) both; transform-origin: top right; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.97) } to { opacity: 1; transform: none } }
.pane.show { animation: fadeIn var(--dur-base) var(--ease) both; }
@keyframes fadeIn { from { opacity: 0; transform: translateX(6px) } to { opacity: 1; transform: none } }

/* ---- cards: interactive ones lift, static ones stay put ---- */
.acct, .card { transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), transform var(--dur-base) var(--ease); }
.acct:hover { transform: translateY(-2px); }
.acct-feature:hover { transform: translateY(-2px); box-shadow: var(--e3); }

/* ---- rows: background plus the amount nudging in ---- */
.trow { transition: background var(--dur-fast) var(--ease), box-shadow var(--dur-base) var(--ease); }
.trow .tavatar { transition: transform var(--dur-base) var(--ease); }
.trow:hover .tavatar { transform: scale(1.07) rotate(-2deg); }
.trow .amt { transition: transform var(--dur-base) var(--ease); }
.trow:hover .amt { transform: translateX(-2px); }
.trow-actions { transition: opacity var(--dur-fast) var(--ease), transform var(--dur-base) var(--ease); transform: translateX(4px); }
.trow:hover .trow-actions, .trow:focus-within .trow-actions { transform: translateX(0); }
tbody tr { transition: background var(--dur-fast) var(--ease); }
.prow { transition: background var(--dur-fast) var(--ease); border-radius: var(--r-sm); }
.prow:hover { background: rgb(var(--surface-hover)); box-shadow: 0 0 0 8px rgb(var(--surface-hover)); }

/* ---- charts respond to the pointer ---- */
.bar { cursor: default; }
.bar-fill { transition: opacity var(--dur-base) var(--ease), transform var(--dur-base) var(--ease); }
.bar:hover .bar-fill { opacity: 1; transform: translateY(-3px); }
.bar-val, .bar-day { transition: color var(--dur-fast) var(--ease); }
.bar:hover .bar-val, .bar:hover .bar-day { color: rgb(var(--fg)); }

.donut circle { transition: stroke-width var(--dur-base) var(--ease), opacity var(--dur-fast) var(--ease); cursor: default; }
.donut:hover circle { opacity: .5; }
.donut circle:hover { stroke-width: 27; opacity: 1; }
.donut circle:first-child { opacity: 1 !important; }
.dl-row { transition: background var(--dur-fast) var(--ease); border-radius: 6px; }
.dl-row:hover { background: rgb(var(--surface-hover)); box-shadow: 0 0 0 6px rgb(var(--surface-hover)); }

.chart svg path, .chart svg rect, .chart svg circle { transition: opacity var(--dur-base) var(--ease), filter var(--dur-base) var(--ease); }
.chart:hover .tip { transform: translate(-50%, -100%) scale(1.03); }
.tip { transition: transform var(--dur-base) var(--ease); }

/* ---- progress + bars animate to their value ---- */
.track > i, .budget-fill, .stat-bar > i { transition: width var(--dur-slow) var(--ease), background var(--dur-fast) var(--ease); }
.budget:hover .budget-fill { filter: saturate(1.25); }

/* ---- chips ---- */
.chip { transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }
.chip-mute:hover { transform: scale(1.03); }

/* ---- page + sidebar entrance ---- */
.content { animation: rise var(--dur-slow) var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

/* ---- fab ---- */
.fab { transition: transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease); }
.fab:hover { transform: scale(1.06); }
.fab:active { transform: scale(.92); }

/* ---- week rhythm at half width: room to breathe ---- */
.bars { gap: var(--s3); padding-top: var(--s6); }
.bar-fill { border-radius: 7px 7px 3px 3px; }
.bar-val { font-size: var(--t-xs); }
.bar-day { font-size: var(--t-xs); }

/* ---- stat cards: three lines, icon sits with the label ---- */
.stat-card { padding: var(--s5); gap: 0; justify-content: flex-start; }
.stat-card .stat-topline { display: flex; align-items: center; gap: var(--s2); }
.stat-card .stat-icon {
  width: 26px; height: 26px; border-radius: 7px; margin: 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.stat-card .stat-icon .icon-sm { width: 14px; height: 14px; }
.stat-card .stat-label { font-size: var(--t-sm); font-weight: 550; color: rgb(var(--fg-muted)); }
.stat-card .stat-value { font-size: var(--t-xl); margin-top: var(--s3); }
.stat-card .stat-foot { margin-top: var(--s2); font-size: var(--t-sm); }

/* ---- v7.1: no decorative sparkline on the overview account card, so both
   cards in the first row can sit tighter ---- */
.hero { padding: var(--s5) var(--s6); }
.hero-body { margin-top: var(--s4); }
.hero-greeting { font-size: var(--t-md); }
.hero-stats { gap: var(--s3); }

/* =====================================================================
   v8 — missing hover states + components for the remaining Wallet pages
   ===================================================================== */

/* ---- budget rows now respond like every other row ---- */
.budget {
  border-radius: var(--r-sm); margin: 0 calc(var(--s2) * -1); padding: var(--s3) var(--s2);
  transition: background var(--dur-fast) var(--ease);
}
.budget:hover { background: rgb(var(--surface-hover)); }
.budget:hover .budget-mark { opacity: 1; }
.budget-mark { transition: opacity var(--dur-base) var(--ease); }
.budget-fill { transition: width var(--dur-slow) var(--ease), filter var(--dur-base) var(--ease); }

/* ---- column charts respond to the pointer ---- */
.bar-chart rect { transition: opacity var(--dur-base) var(--ease); cursor: default; }
.bar-chart:hover rect { opacity: .35; }
.bar-chart rect:hover { opacity: 1; }

/* ---- progress ring (goals) ---- */
.ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray var(--dur-slow) var(--ease); }
.ring-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.ring-center .v { font-size: var(--t-md); font-weight: 660; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring-center .k { font-size: 10px; color: rgb(var(--fg-subtle)); font-weight: 550; }

/* ---- goal card ---- */
.goal { display: flex; gap: var(--s4); align-items: center; }
.goal-main { flex: 1; min-width: 0; }
.goal-name { font-size: var(--t-base); font-weight: 600; }
.goal-sub { font-size: var(--t-xs); color: rgb(var(--fg-subtle)); margin-top: 2px; }
.goal-fig { font-size: var(--t-lg); font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: var(--s2); }
.goal-fig span { font-size: var(--t-sm); font-weight: 550; color: rgb(var(--fg-subtle)); }

/* ---- month calendar (recurring) ---- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
.cal-dow { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); text-align: center; font-weight: 550; padding-bottom: 2px; }
.cal-day {
  aspect-ratio: 1; border-radius: var(--r-sm); border: 1px solid rgb(var(--line-subtle));
  padding: 5px 6px; display: flex; flex-direction: column; gap: 3px;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), transform var(--dur-base) var(--ease);
}
.cal-day:hover { border-color: rgb(var(--line-strong)); background: rgb(var(--surface-hover)); transform: translateY(-2px); }
.cal-day.muted { opacity: .38; }
.cal-day.today { border-color: rgb(var(--accent)); box-shadow: inset 0 0 0 1px rgb(var(--accent) / .4); }
.cal-n { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); font-variant-numeric: tabular-nums; }
.cal-day.today .cal-n { color: rgb(var(--accent-fg)); font-weight: 700; }
.cal-amt { font-size: var(--t-micro); font-weight: 600; margin-top: auto; font-variant-numeric: tabular-nums; }
.cal-dots { display: flex; gap: 3px; flex-wrap: wrap; }
.cal-dots i { width: 5px; height: 5px; border-radius: var(--r-full); }

/* ---- diverging comparison bars (reports) ---- */
.div-row { display: grid; grid-template-columns: 130px 1fr 92px; gap: var(--s3); align-items: center; padding: var(--s2) 0; }
.div-name { font-size: var(--t-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.div-track { position: relative; height: 18px; }
.div-track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: rgb(var(--line-strong)); }
.div-bar { position: absolute; top: 3px; height: 12px; border-radius: 3px; transition: width var(--dur-slow) var(--ease), filter var(--dur-base) var(--ease); }
.div-row:hover .div-bar { filter: saturate(1.3); }
.div-val { text-align: right; font-size: var(--t-sm); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---- settlement / person balance ---- */
.bal-row { display: grid; grid-template-columns: 1fr 200px 108px; gap: var(--s3); align-items: center; padding: var(--s3) var(--s2); margin: 0 calc(var(--s2)*-1); border-radius: var(--r-sm); transition: background var(--dur-fast) var(--ease); }
.bal-row:hover { background: rgb(var(--surface-hover)); }
.bal-track { position: relative; height: 8px; }
.bal-track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: rgb(var(--line-strong)); }
.bal-bar { position: absolute; top: 0; height: 8px; border-radius: var(--r-full); }
.settle-row { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid rgb(var(--line-subtle)); }
.settle-row:first-of-type { border-top: none; }
.settle-arrow { color: rgb(var(--fg-faint)); flex-shrink: 0; }

/* ---- status dot + generic meta list ---- */
.dot-s { width: 7px; height: 7px; border-radius: var(--r-full); flex-shrink: 0; display: inline-block; }
.kv { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--t-sm); padding: var(--s2) 0; border-top: 1px solid rgb(var(--line-subtle)); }
.kv:first-child { border-top: none; }
.kv .k { color: rgb(var(--fg-subtle)); }
.kv .v { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---- generic list row used by recurring / reports ---- */
.lrow {
  display: grid; align-items: center; gap: var(--s3);
  grid-template-columns: 1fr 128px 116px 104px 92px 32px;
  padding: var(--s3) var(--s2); margin: 0 calc(var(--s2) * -1);
  border-radius: var(--r-md); border-top: 1px solid rgb(var(--line-subtle));
  transition: background var(--dur-fast) var(--ease);
}
.lrow:first-of-type { border-top: none; }
.lrow:hover { background: rgb(var(--surface-hover)); }
.lrow:hover .tavatar { transform: scale(1.07) rotate(-2deg); }
.lrow .trow-actions { opacity: 0; }
.lrow:hover .trow-actions, .lrow:focus-within .trow-actions { opacity: 1; transform: translateX(0); }
.lhead {
  display: grid; gap: var(--s3);
  grid-template-columns: 1fr 128px 116px 104px 92px 32px;
  padding: 0 var(--s2) var(--s2);
  font-size: var(--t-xs); font-weight: 550; color: rgb(var(--fg-subtle));
}
.lhead .num, .lrow .num { text-align: right; }

@media (max-width: 1080px) {
  .lrow, .lhead { grid-template-columns: 1fr 110px 96px 32px; }
  .lrow .col-hide-md, .lhead .col-hide-md { display: none; }
  .div-row { grid-template-columns: 110px 1fr 84px; }
  .bal-row { grid-template-columns: 1fr 140px 96px; }
}
@media (max-width: 680px) {
  .lrow, .lhead { grid-template-columns: 1fr auto; }
  .lrow .col-mobile-hide, .lhead .col-mobile-hide { display: none; }
  .lhead { display: none; }
  .bal-row { grid-template-columns: 1fr 96px; }
  .bal-row .bal-track { display: none; }
  .cal { gap: 4px; }
  .cal-amt { display: none; }
  .goal { gap: var(--s3); }
  .ring { width: 76px; height: 76px; }
}
/* calendar cells: fixed rhythm, not a square that grows with the grid */
.cal-day { aspect-ratio: auto; min-height: 74px; }
@media (max-width: 680px) { .cal-day { min-height: 52px; } }
/* mobile: stat cards pair up instead of one per screen; 4-up tag rows stay 2-up */
@media (max-width: 680px) { .c3 { grid-column: span 6; } }
@media (max-width: 420px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.cal-day { border-color: rgb(var(--line)); }

/* ---- v9: per-person settle, and compact suggestion / contribution rows ---- */
.bal-row { grid-template-columns: 1fr 180px 104px 78px; }
.bal-row .btn { opacity: 0; transition: opacity var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }
.bal-row:hover .btn, .bal-row:focus-within .btn { opacity: 1; }
.settle-row .btn { margin-left: auto; }
.settle-row .pamt { margin-left: 0; min-width: 76px; text-align: right; }

/* suggestion / action rows: one line of text, action on the right */
.sug { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid rgb(var(--line-subtle)); }
.sug:first-of-type { border-top: none; padding-top: 0; }
.sug-main { flex: 1; min-width: 0; }
.sug-title { font-size: var(--t-sm); font-weight: 550; }
.sug-sub { font-size: var(--t-xs); color: rgb(var(--fg-subtle)); margin-top: 1px; }
.sug .btn { flex-shrink: 0; }

@media (max-width: 1080px) { .bal-row { grid-template-columns: 1fr 140px 96px 78px; } }
@media (max-width: 680px) {
  .bal-row { grid-template-columns: 1fr 96px 72px; }
  .bal-row .btn { opacity: 1; }
}
.sug { padding: var(--s2) 0; }
.kv { padding: 6px 0; }

/* ---- v10: summary band — a short full-width card with no partner to match ---- */
.band { display: flex; align-items: flex-start; gap: var(--s6); flex-wrap: wrap; }
.band-main { min-width: 220px; }
.band-fig { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.band-fig .v { font-size: var(--t-2xl); font-weight: 680; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.band-fig .k { font-size: var(--t-sm); color: rgb(var(--fg-subtle)); font-variant-numeric: tabular-nums; }
.band-stats {
  display: flex; gap: var(--s6); margin-left: auto;
  padding-left: var(--s6); border-left: 1px solid rgb(var(--line-subtle));
}
.band-stat .k { font-size: var(--t-xs); color: rgb(var(--fg-subtle)); }
.band-stat .v { font-size: var(--t-md); font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.band-stat .s { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); margin-top: 2px; }
@media (max-width: 900px) {
  .band-stats { margin-left: 0; padding-left: 0; border-left: none; padding-top: var(--s4);
                border-top: 1px solid rgb(var(--line-subtle)); width: 100%; justify-content: space-between; gap: var(--s4); }
}

/* balances: the settle action gets its own column and the total lines up with it */
.bal-row { grid-template-columns: 1fr 176px 104px 76px; }
.bal-row .btn { opacity: 1; }
.bal-foot { display: grid; grid-template-columns: 1fr 176px 104px 76px; gap: var(--s3); align-items: baseline; padding: 0 var(--s2); }
.bal-foot .lbl { grid-column: 1 / 3; font-size: var(--t-sm); color: rgb(var(--fg-subtle)); }
.bal-foot .val { grid-column: 3; text-align: right; }
@media (max-width: 1080px) { .bal-row, .bal-foot { grid-template-columns: 1fr 140px 96px 76px; } }
@media (max-width: 680px) {
  .bal-row, .bal-foot { grid-template-columns: 1fr 96px 72px; }
  .bal-foot .lbl { grid-column: 1; } .bal-foot .val { grid-column: 2; }
}
@media (max-width: 680px) {
  /* the per-person Settle is redundant on mobile — the Settle up card below
     shows the same three actions with more room */
  .bal-row { grid-template-columns: 1fr auto; }
  .bal-row .btn { display: none; }
  .bal-foot { grid-template-columns: 1fr auto; }
  .bal-foot .lbl { grid-column: 1; } .bal-foot .val { grid-column: 2; }
  /* four-up key/value rows stack rather than wrap */
  .band ~ .grid.g4 { grid-template-columns: minmax(0,1fr); }
  .band ~ .grid.g4 .kv { padding: 5px 0; border-top: 1px solid rgb(var(--line-subtle)); }
  .band ~ .grid.g4 .kv:first-child { border-top: none; }
}
/* balances has no per-row action again — three columns, total aligned to the amount */
.bal-row, .bal-foot { grid-template-columns: 1fr 176px 104px; }
@media (max-width: 1080px) { .bal-row, .bal-foot { grid-template-columns: 1fr 140px 104px; } }
@media (max-width: 680px) { .bal-row, .bal-foot { grid-template-columns: 1fr auto; } }

/* =====================================================================
   TASKS MODULE
   ===================================================================== */

/* quick add — the primary way tasks get in */
.qadd {
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s4); height: 48px;
  border: 1px solid rgb(var(--line)); border-radius: var(--r-md);
  background: rgb(var(--surface));
  transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), transform var(--dur-base) var(--ease);
}
.qadd:focus-within { border-color: rgb(var(--accent) / .6); box-shadow: 0 0 0 4px rgb(var(--accent) / .12); transform: scale(1.004); }
.qadd input { flex: 1; border: none; outline: none; background: transparent; font-size: var(--t-base); color: rgb(var(--fg)); min-width: 0; }
.qadd input::placeholder { color: rgb(var(--fg-faint)); }
.qadd .hint { font-size: var(--t-xs); color: rgb(var(--fg-faint)); white-space: nowrap; }
.qadd .plus { color: rgb(var(--accent)); display: flex; }

/* checkbox */
.tcheck {
  width: 20px; height: 20px; border-radius: 7px; flex-shrink: 0;
  border: 1.75px solid rgb(var(--line-strong)); background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: transparent;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease),
              color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.tcheck svg { width: 13px; height: 13px; stroke-width: 3; }
.tcheck:hover { border-color: rgb(var(--accent)); transform: scale(1.1); }
.tcheck:active { transform: scale(.9); }
.tcheck.on { background: rgb(var(--accent)); border-color: rgb(var(--accent)); color: #fff; }
[data-theme="dark"] .tcheck.on { color: rgb(var(--n-1000)); }
.tcheck.pri-high { border-color: rgb(var(--neg)); }
.tcheck.pri-med  { border-color: rgb(var(--warn)); }

/* task row */
.task {
  display: grid; align-items: center; gap: var(--s3);
  grid-template-columns: 20px 1fr 128px 108px 28px 32px;
  padding: var(--s3) var(--s2); margin: 0 calc(var(--s2) * -1);
  border-radius: var(--r-md); border-top: 1px solid rgb(var(--line-subtle));
  transition: background var(--dur-fast) var(--ease);
}
.task:first-of-type { border-top: none; }
.task:hover { background: rgb(var(--surface-hover)); }
.task:hover .trow-actions, .task:focus-within .trow-actions { opacity: 1; transform: translateX(0); }
.task-title { font-size: var(--t-base); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-sub { font-size: var(--t-xs); color: rgb(var(--fg-subtle)); margin-top: 1px; display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.task-when { font-size: var(--t-sm); color: rgb(var(--fg-muted)); font-variant-numeric: tabular-nums; }
.task-when.late { color: rgb(var(--neg-fg)); font-weight: 550; }
.task-when.soon { color: rgb(var(--warn-fg)); font-weight: 550; }
.task.done .task-title { text-decoration: line-through; color: rgb(var(--fg-subtle)); text-decoration-color: rgb(var(--fg-faint)); }
.task.done .task-sub, .task.done .task-when { opacity: .7; }
.task .trow-actions { opacity: 0; transform: translateX(4px); transition: opacity var(--dur-fast) var(--ease), transform var(--dur-base) var(--ease); }

/* list chip — a task's list, coloured like a category */
.lchip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 500; color: rgb(var(--fg-muted)); }
.lchip i { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.sub-count { display: inline-flex; align-items: center; gap: 3px; font-size: var(--t-xs); color: rgb(var(--fg-subtle)); }

/* group header inside a task card */
.tgroup {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s5) 0 var(--s2); font-size: var(--t-xs);
  color: rgb(var(--fg-subtle)); font-weight: 600;
}
.tgroup:first-child { padding-top: 0; }
.tgroup .n { color: rgb(var(--fg-faint)); font-weight: 500; }
.tgroup .line { flex: 1; height: 1px; background: rgb(var(--line-subtle)); }

/* week load strip */
.load { display: flex; gap: var(--s2); }
.load-day {
  flex: 1; text-align: center; padding: var(--s2) 0; border-radius: var(--r-sm);
  border: 1px solid rgb(var(--line-subtle));
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), transform var(--dur-base) var(--ease);
}
.load-day:hover { border-color: rgb(var(--line-strong)); transform: translateY(-2px); }
.load-day.today { border-color: rgb(var(--accent)); background: rgb(var(--accent-bg)); }
.load-d { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); }
.load-n { font-size: var(--t-md); font-weight: 650; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.load-day.today .load-n { color: rgb(var(--accent-fg)); }
.load-bar { height: 3px; border-radius: 2px; margin: 6px var(--s2) 0; background: rgb(var(--track)); overflow: hidden; }
.load-bar > i { display: block; height: 100%; border-radius: 2px; background: rgb(var(--accent)); }

/* list overview row */
.lrow-list { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s2); margin: 0 calc(var(--s2)*-1); border-radius: var(--r-sm); transition: background var(--dur-fast) var(--ease); }
.lrow-list:hover { background: rgb(var(--surface-hover)); }
.lrow-list .track { width: 92px; flex-shrink: 0; }

@media (max-width: 1080px) {
  .task { grid-template-columns: 20px 1fr 104px 28px 32px; }
  .task .col-hide-md { display: none; }
}
@media (max-width: 680px) {
  .task { grid-template-columns: 20px 1fr auto; padding: var(--s3) var(--s2); }
  .task .col-mobile-hide { display: none; }
  .task .trow-actions { display: none; }
  .qadd { height: 44px; padding: 0 var(--s3); }
  .qadd .hint { display: none; }
  .load { gap: 4px; }
}
/* a task list fills its row — the space below the last task is room for more */
.dash > section.c8 { display: flex; flex-direction: column; }
.dash > section.c8 > .card:last-child { flex: 1; }

/* ---- week board (Upcoming) ---- */
.board { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: var(--s2); align-items: start; }
.bcol { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.bcol-head { display: flex; align-items: baseline; gap: 6px; padding: 0 var(--s1) var(--s1); }
.bcol-d { font-size: var(--t-xs); font-weight: 600; }
.bcol-n { font-size: var(--t-micro); color: rgb(var(--fg-subtle)); margin-left: auto; font-variant-numeric: tabular-nums; }
.bcol.today .bcol-d { color: rgb(var(--accent-fg)); }
.bcol-body {
  display: flex; flex-direction: column; gap: 6px; min-height: 148px;
  padding: 6px; border-radius: var(--r-md); background: rgb(var(--surface-sunk));
  transition: background var(--dur-fast) var(--ease);
}
.bcol.today .bcol-body { background: rgb(var(--accent-bg)); }
