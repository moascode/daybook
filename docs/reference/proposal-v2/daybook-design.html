.bcol-body:hover { background: rgb(var(--surface-active)); }
.bcard {
  background: rgb(var(--surface)); border: 1px solid rgb(var(--line));
  border-radius: var(--r-sm); padding: var(--s2); font-size: var(--t-xs);
  border-left: 3px solid rgb(var(--line-strong));
  transition: transform var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), border-color var(--dur-fast) var(--ease);
  cursor: grab;
}
.bcard:hover { transform: translateY(-2px); box-shadow: var(--e2); }
.bcard-t { font-weight: 500; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bcard-m { display: flex; align-items: center; gap: 5px; margin-top: 5px; color: rgb(var(--fg-subtle)); font-size: 10px; }
.bcol-add {
  border: 1px dashed rgb(var(--line-strong)); border-radius: var(--r-sm);
  padding: 5px; font-size: var(--t-micro); color: rgb(var(--fg-faint));
  display: flex; align-items: center; justify-content: center; gap: 4px;
  transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.bcol-add:hover { color: rgb(var(--accent-fg)); border-color: rgb(var(--accent)); }

/* ---- completion heatmap ---- */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat i {
  width: 100%; aspect-ratio: 1; border-radius: 3px; background: rgb(var(--track));
  transition: transform var(--dur-base) var(--ease), outline-color var(--dur-fast) var(--ease);
  outline: 1px solid transparent;
}
.heat i:hover { transform: scale(1.35); outline-color: rgb(var(--fg-faint)); }
.heat i.l1 { background: rgb(var(--accent) / .25); }
.heat i.l2 { background: rgb(var(--accent) / .45); }
.heat i.l3 { background: rgb(var(--accent) / .7); }
.heat i.l4 { background: rgb(var(--accent)); }
.heat-key { display: flex; align-items: center; gap: 4px; font-size: var(--t-micro); color: rgb(var(--fg-subtle)); }
.heat-key i { width: 10px; height: 10px; border-radius: 3px; }

/* ---- habit dot grid ---- */
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dots i {
  width: 14px; height: 14px; border-radius: 5px; background: rgb(var(--track));
  transition: transform var(--dur-base) var(--ease);
}
.dots i:hover { transform: scale(1.25); }
.dots i.on { background: rgb(var(--accent)); }
.dots i.miss { background: rgb(var(--neg) / .3); }
.habit { display: flex; align-items: center; gap: var(--s4); }
.habit-main { flex: 1; min-width: 0; }
.streak { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-sm); font-weight: 650; font-variant-numeric: tabular-nums; }

@media (max-width: 1080px) { .board { grid-template-columns: repeat(4, minmax(0,1fr)); } }
@media (max-width: 680px) {
  .board { grid-template-columns: minmax(0,1fr); }
  .bcol-body { min-height: 0; }
  .habit { gap: var(--s3); }
}

/* =====================================================================
   COMPOSER — the module's primary action, at the top, impossible to miss
   ===================================================================== */
.composer {
  background: rgb(var(--surface));
  border: 1px solid rgb(var(--line));
  border-radius: var(--r-lg);
  box-shadow: var(--e2);
  padding: var(--s4);
  margin-bottom: var(--s5);
  transition: box-shadow var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease);
}
.composer:focus-within { border-color: rgb(var(--accent) / .55); box-shadow: 0 0 0 4px rgb(var(--accent) / .10), var(--e3); }
.composer-top { display: flex; align-items: center; gap: var(--s3); }
.composer-top .avatar { width: 40px; height: 40px; font-size: var(--t-xs); }
.composer-field {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s3);
  height: 48px; padding: 0 var(--s5); border-radius: var(--r-full);
  background: rgb(var(--surface-sunk)); border: 1px solid transparent;
  transition: background var(--dur-base) var(--ease), border-color var(--dur-base) var(--ease),
              transform var(--dur-slow) var(--ease), box-shadow var(--dur-base) var(--ease);
  cursor: text;
}
.composer-field:hover { background: rgb(var(--surface-hover)); }
.composer-field:focus-within {
  background: rgb(var(--surface)); border-color: rgb(var(--line));
  transform: scale(1.012); box-shadow: var(--e2);
}
.composer-field input {
  flex: 1; min-width: 0; border: none; outline: none; background: transparent;
  font-size: var(--t-md); color: rgb(var(--fg)); letter-spacing: -.01em;
}
.composer-field input::placeholder { color: rgb(var(--fg-subtle)); }
.composer-field .kbd { flex-shrink: 0; }
.composer-send {
  width: 40px; height: 40px; border-radius: var(--r-full); flex-shrink: 0;
  background: rgb(var(--ink)); color: rgb(var(--on-ink));
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--dur-base) var(--ease), opacity var(--dur-base) var(--ease);
}
.composer-send:hover { transform: scale(1.08); }
.composer-send:active { transform: scale(.92); }

.composer-acts {
  display: flex; gap: var(--s1); margin-top: var(--s3);
  padding-top: var(--s3); border-top: 1px solid rgb(var(--line-subtle));
}
.composer-act {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--s2);
  height: 40px; border-radius: var(--r-sm); white-space: nowrap;
  font-size: var(--t-sm); font-weight: 550; color: rgb(var(--fg-muted));
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-base) var(--ease);
}
.composer-act:hover { background: rgb(var(--surface-hover)); color: rgb(var(--fg)); }
.composer-act:active { transform: scale(.97); }
.composer-act .icon-sm { width: 17px; height: 17px; }
.composer-act .cdot { width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.composer-act .cdot .icon-sm { width: 13px; height: 13px; }

@media (max-width: 900px) {
  .composer-acts { overflow-x: auto; scrollbar-width: none; }
  .composer-acts::-webkit-scrollbar { display: none; }
  .composer-act { flex: 0 0 auto; padding: 0 var(--s3); }
}
@media (max-width: 680px) {
  .composer { padding: var(--s3); margin-bottom: var(--s4); }
  .composer-top .avatar, .composer-send { width: 36px; height: 36px; }
  .composer-field { height: 44px; padding: 0 var(--s4); }
  .composer-field input { font-size: var(--t-base); }
  .composer-field .kbd { display: none; }
}
/* action row reads as a cluster, not five items stretched across the page */
.composer-acts { justify-content: flex-start; gap: var(--s1); }
.composer-act { flex: 0 0 auto; padding: 0 var(--s3); }
/* the pill owns the focus affordance — the input must not draw a second ring */
.composer-field input:focus-visible, .qadd input:focus-visible { box-shadow: none; }

</style>

<script>
(function () {
  const app = document.getElementById('app');
  const titles = {"dashboard": "Wallet \u00b7 Overview", "transactions": "Wallet \u00b7 Transactions", "accounts": "Wallet \u00b7 Accounts", "shared": "Wallet \u00b7 Shared", "budgets": "Wallet \u00b7 Budgets", "goals": "Wallet \u00b7 Goals", "recurring": "Wallet \u00b7 Recurring", "reports": "Wallet \u00b7 Reports", "tasks": "Tasks \u00b7 Today", "tasks-upcoming": "Tasks \u00b7 Upcoming", "tasks-all": "Tasks \u00b7 All tasks", "tasks-assigned": "Tasks \u00b7 Assigned to me", "tasks-list": "Tasks \u00b7 Household", "tasks-completed": "Tasks \u00b7 Completed", "tasks-habits": "Tasks \u00b7 Habits"};
  function bind() {
    document.querySelectorAll('.segment').forEach(s => s.addEventListener('click', e => {
      if (e.target.tagName !== 'BUTTON') return;
      s.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b === e.target));
    }));
    document.querySelectorAll('.tcheck').forEach(c => c.addEventListener('click', () => {
      c.classList.toggle('on');
      const row = c.closest('.task'); if (row) row.classList.toggle('done');
    }));
  }
  function render(page, push) {
    const t = document.querySelector('template[data-page="' + page + '"]');
    if (!t) return;
    app.innerHTML = '';
    app.appendChild(t.content.cloneNode(true));
    document.title = 'Daybook — ' + (titles[page] || page);
    if (push !== false) history.replaceState(null, '', '#' + page);
    window.scrollTo(0, 0);
    bind();
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href$=".html"]');
    if (a) { e.preventDefault(); render(a.getAttribute('href').replace('.html', '')); closeSidebar(); return; }
    if (!e.target.closest('.pop-anchor')) {
      const p = document.getElementById('account');
      if (p && p.classList.contains('open')) { p.classList.remove('open'); showPane('pane-root'); }
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { const p = document.getElementById('account'); if (p) { p.classList.remove('open'); showPane('pane-root'); } }
    if ((e.key === 'n' || e.key === 'N') && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      const f = document.querySelector('.composer-field input'); if (f) { e.preventDefault(); f.focus(); }
    }
  });
  window.toggleTheme = function () {
    const b = document.body;
    b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
  window.openSidebar = function () {
    const s = document.getElementById('sidebar'); if (!s) return;
    s.classList.add('open'); document.querySelector('.sidebar-backdrop').classList.add('show');
  };
  window.closeSidebar = function () {
    const s = document.getElementById('sidebar'); if (!s) return;
    s.classList.remove('open'); const b = document.querySelector('.sidebar-backdrop'); if (b) b.classList.remove('show');
  };
  window.toggleAccount = function () {
    const p = document.getElementById('account'); if (!p) return;
    const open = p.classList.toggle('open');
    const t = p.parentElement.querySelector('[aria-haspopup]');
    if (t) t.setAttribute('aria-expanded', String(open));
    if (!open) showPane('pane-root');
  };
  window.showPane = function (id) {
    document.querySelectorAll('#account .pane').forEach(x => x.classList.toggle('show', x.id === id));
  };
  const start = (location.hash || '#dashboard').slice(1);
  render(document.querySelector('template[data-page="' + start + '"]') ? start : 'dashboard', false);
  window.addEventListener('hashchange', () => render((location.hash || '#dashboard').slice(1), false));
})();
</script>
